
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: digital-store-api

    restart: unless-stopped

    env_file:
      - .env

    environment:
      NODE_ENV: development
      PORT: 3000
      DB_HOST: db

    ports:
      - "3000:3000"

    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4

    container_name: digital-store-db

    restart: unless-stopped

    environment:
      MYSQL_DATABASE: ${DB_NAME:-digital_store}
      MYSQL_USER: ${DB_USER:-digital_store_user}
      MYSQL_PASSWORD: ${DB_PASS:?Defina DB_PASS no arquivo .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Defina DB_ROOT_PASSWORD no arquivo .env}

    ports:
      - "3307:3306"

    volumes:
      - digital_store_data:/var/lib/mysql

    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  digital_store_data:
